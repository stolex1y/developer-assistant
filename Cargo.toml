[package]
name = "developer-assistant"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Локальный read-only ассистент проекта по README и docs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "macros", "transport-child-process", "transport-io"] }
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.22", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
