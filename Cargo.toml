[package]
name = "developer-assistant"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Ассистент проекта: ответы по документации, review и файловые задачи с подтверждением diff"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastembed = { version = "6.1.0", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
sha2 = "0.10"
regex = "1"
markdown-to-ansi = "0.2.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
same-file = "1.0.6"
rustyline = "15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "server", "macros", "transport-child-process", "transport-io"] }
serde = { version = "1", features = ["derive"] }
toml_edit = { version = "0.22", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
